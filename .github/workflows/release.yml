name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Zip repository
        run: zip -r release.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip